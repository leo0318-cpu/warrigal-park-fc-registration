[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warrigal-park-fc-registration"
version = "0.1.0"
description = "Warrigal Park FC member registration and team roster system (ISY3001 Assignment 3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - student assignment" }
dependencies = []

[project.scripts]
warrigal = "warrigal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
